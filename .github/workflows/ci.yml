name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src tests   # config: pyproject.toml [tool.ruff]

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDK deps
        working-directory: infra
        run: pip install -r requirements.txt

      - name: cdk synth (dev) - catches construct-level errors before deploy
        working-directory: infra
        run: python3 ci_synth_check.py
